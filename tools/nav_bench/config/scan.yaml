# pointcloud_to_laserscan on FAST-LIO2's deskewed /cloud_registered_body. Heights are metres above the floor in base_footprint
# (planar_odom.py), the same band make_map.sh rasterizes as obstacle: 0.10 .. CEIL (1.80). Keep both in sync.
/**:
  ros__parameters:
    target_frame: base_footprint
    transform_tolerance: 0.2
    min_height: 0.10
    max_height: 1.80
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.00873   # 0.5 deg
    scan_time: 0.1
    range_min: 0.1             # Mid-360 blind zone is 0.1 m. FAST-LIO2 cuts first at its own `blind`: keep that <= this value in the FAST-LIO config of the run, or this has no effect
    range_max: 60.0
    use_inf: true
    inf_epsilon: 1.0
    queue_size: 10             # the stock node defaults to the core count (12 / 8 / 6 on AGX / NX / Nano): the same on every board
    # angle_max - angle_min must not be an exact multiple of angle_increment: the stock node does not bound-check the bin index (here 720 bins, the last index 719)
