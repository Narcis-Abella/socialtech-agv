# Overlay (params_merge.py): local costmap window 5 x 5 m (packaged 3 x 3: only 1.5 m around the robot is seen by the controller) and obstacle marking/raytrace ranges 4.0 / 4.5 m (packaged 2.5 / 3.0).
local_costmap:
  local_costmap:
    ros__parameters:
      width: 5
      height: 5
      obstacle_layer:
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: LaserScan, raytrace_max_range: 4.5, raytrace_min_range: 0.0, obstacle_max_range: 4.0, obstacle_min_range: 0.0}
