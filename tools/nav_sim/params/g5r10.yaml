# Overlay (params_merge.py): the fast end of g2r10.yaml: global costmap 5 Hz, marking/raytrace to 10 m, BT replanning 3 Hz.
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      obstacle_layer:
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: LaserScan, raytrace_max_range: 10.0, raytrace_min_range: 0.0, obstacle_max_range: 10.0, obstacle_min_range: 0.0}
bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: /tools/nav_sim/bt/replan3.xml
