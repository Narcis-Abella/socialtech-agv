# Overlay (params_merge.py): the production speed profile with the 0.6 m/s target (Narcis, 2026-10-25). Velocity smoother limits as left on the robot (dentos-app session 2026-10-09: accel 0.5, decel -1.0, angular 1.2); smoother linear ceiling = target + 0.1 as in the real steps.
# Used to compare images whose packaged speed differs (sim-nav2-prev packs 0.3 m/s).
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.6
      rotate_to_heading_angular_vel: 0.9
velocity_smoother:
  ros__parameters:
    max_velocity: [0.7, 0.0, 1.2]
    min_velocity: [-0.2, 0.0, -1.2]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
