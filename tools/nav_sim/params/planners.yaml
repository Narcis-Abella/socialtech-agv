# Overlay for the global planner benchmark (params_merge.py on top of nav2_params.yaml): the five candidate planners next to the current Smac2D (GridBased).
# Values are the Jazzy defaults of each plugin where they exist, footprint-aware ones sized for the 0.70 x 0.58 m robot. Parameter names are checked against the ones the server declares
# (plan_bench.py writes declared_params.txt and prints the overlay keys the server does not know).
planner_server:
  ros__parameters:
    planner_plugins: [GridBased, NavFn, ThetaStar, SmacHybrid, SmacLattice]
    NavFn:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: false
    ThetaStar:
      plugin: nav2_theta_star_planner::ThetaStarPlanner
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      w_heuristic_cost: 1.0
      allow_unknown: false
    SmacHybrid:
      plugin: nav2_smac_planner::SmacPlannerHybrid
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.4
      reverse_penalty: 2.1
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
    SmacLattice:
      plugin: nav2_smac_planner::SmacPlannerLattice
      allow_unknown: false
      tolerance: 0.25
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      lattice_filepath: /opt/ros/jazzy/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: true
