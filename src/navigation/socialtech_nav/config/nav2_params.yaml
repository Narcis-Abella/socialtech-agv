# Base Nav2 parameters of the SocialTech Tracer, inside the image (socialtech_nav). Origin: nav2_bringup/params/nav2_params.yaml of Jazzy 1.3.13, with RPP instead of MPPI and Smac2D instead of Navfn.
# Nothing uses this file alone: ops/nav2_robot_overrides.yaml is merged over it (ops/merge_params.py: nav_live.sh, tools/nav_sim/nav_full_sim.sh). The split is deliberate: the overrides are bind-mounted
# from the checkout, so tuning the robot needs no image rebuild. The values in force are the merged ones, and the dated reasons for each change are in the overrides. What they always replace (footprint,
# local frame, smoother accelerations, RPP lookahead/rotation/acceleration, goal checkers, default_server_timeout, collision-monitor zones) keeps its first value here only as a default.
# Costmaps: local = ObstacleLayer on /scan (rolling window) + inflation 0.70 m; global = DecayObstacleLayer (socialtech_costmap) on /cloud_registered_body, marking cut at 0.10 m, cells expire after 60 s,
# + the static map + inflation 1.2 m (above the 1.0 m outer collision-monitor zone, so sensor noise in open spaces does not trigger it). The collision monitor is off while each layer is tested (2026-11-03).
# use_sim_time comes from the launch (SetParameter).
# bond_heartbeat_period 1.0 (default 0.1): node side of the lifecycle_manager bonds; detection stays the 4 s bond_timeout. The manager side keeps its hard-coded 0.1 s, so /bond traffic drops by about half (arithmetic, ledger lever 4).
/**:
  ros__parameters:
    bond_heartbeat_period: 1.0
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    # Replans at 2 Hz (the packaged BT: 1 Hz). Absolute path: the install base of socialtech_nav in the images is /opt/socialtech.
    default_nav_to_pose_bt_xml: /opt/socialtech/share/socialtech_nav/behavior_trees/navigate_to_pose_replan2.xml
    navigate_to_pose: {plugin: 'nav2_bt_navigator::NavigateToPoseNavigator'}
    navigate_through_poses: {plugin: 'nav2_bt_navigator::NavigateThroughPosesNavigator'}
    error_code_names: [compute_path_error_code, follow_path_error_code]
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    use_realtime_priority: false
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.5, movement_time_allowance: 20.0}
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker', xy_goal_tolerance: 0.15, yaw_goal_tolerance: 0.25}
    # max_angular_accel: rotateToHeading clamps the command to (measured w +- max_angular_accel * dt) (controller_server passes the /odom twist). The real Tracer reports ~73 % of a low angular command, so the command
    # stalls at a * dt / (1 - 0.73): 1.0 rad/s^2 at 20 Hz gave 0.18 rad/s (122 deg in 13 s on the robot, 2026-10-07). Reaching rotate_to_heading_angular_vel needs a >= 0.9 * 0.27 / 0.05 = 4.9; the robot now runs 2.0 (ops/nav2_robot_overrides.yaml).
    # The real ramp is still limited by velocity_smoother max_accel. The simulated base follows the command exactly, so the sim does not show this stall.
    FollowPath: {plugin: 'nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController', desired_linear_vel: 0.6, lookahead_dist: 0.6,
      min_lookahead_dist: 0.3, max_lookahead_dist: 0.9, use_velocity_scaled_lookahead_dist: true, use_regulated_linear_velocity_scaling: true,
      use_cost_regulated_linear_velocity_scaling: true, use_rotate_to_heading: true, rotate_to_heading_angular_vel: 0.9, max_angular_accel: 5.0,
      allow_reversing: false}
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.025
      plugins: [obstacle_layer, inflation_layer]
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 4.0, inflation_radius: 0.70}
      always_send_full_costmap: true
      footprint: '[[0.35, 0.29], [0.35, -0.29], [-0.35, -0.29], [-0.35, 0.29]]'
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: LaserScan, inf_is_valid: true, raytrace_max_range: 3.0, raytrace_min_range: 0.0,
          obstacle_max_range: 2.5, obstacle_min_range: 0.0}
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true}
      obstacle_layer:
        plugin: socialtech_costmap/DecayObstacleLayer   # global only (it refuses a rolling window). A ray frees a cell only if it went through the heights the cell was marked at: a 2D scan frees a low object that left the lidar's view (socialtech_costmap/test/band_test.py)
        height_band_clearing: true
        observation_expiry: 60.0   # what the lidar cannot see any more is remembered for 60 s, then freed (Narcis, 2026-11-04)
        enabled: true
        observation_sources: cloud
        min_obstacle_height: 0.10   # marking cut: the floor cut of tools/nav_common/config/scan.yaml
        max_obstacle_height: 1.8
        cloud: {topic: /cloud_registered_body, data_type: PointCloud2, sensor_frame: lidar_level, min_obstacle_height: -0.5, max_obstacle_height: 1.8, clearing: true, marking: true,   # -0.5: the floor stays in the source, the rays that end on it free low objects
          raytrace_max_range: 10.0, raytrace_min_range: 0.0, obstacle_max_range: 10.0, obstacle_min_range: 0.0}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 4.0, inflation_radius: 1.2}
      always_send_full_costmap: true
      footprint: '[[0.35, 0.29], [0.35, -0.29], [-0.35, -0.29], [-0.35, 0.29]]'
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: [GridBased]
    costmap_update_timeout: 1.0
    GridBased: {plugin: 'nav2_smac_planner::SmacPlanner2D', tolerance: 0.25, allow_unknown: false, max_planning_time: 2.0, cost_travel_multiplier: 2.0}
smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother: {plugin: 'nav2_smoother::SimpleSmoother', tolerance: 1.0e-10, max_its: 1000, do_refinement: true}
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin: {plugin: 'nav2_behaviors::Spin'}
    backup: {plugin: 'nav2_behaviors::BackUp'}
    drive_on_heading: {plugin: 'nav2_behaviors::DriveOnHeading'}
    wait: {plugin: 'nav2_behaviors::Wait'}
    assisted_teleop: {plugin: 'nav2_behaviors::AssistedTeleop'}
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.9      # as run on the robot; the base under-responds below ~0.5 rad/s, hence the higher minimum
    min_rotational_vel: 0.6
    rotational_acc_lim: 3.2
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: 'nav2_waypoint_follower::WaitAtWaypoint', enabled: true, waypoint_pause_duration: 200}
route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: [AdjustSpeedLimit, ReroutingService, CollisionMonitor]
    ReroutingService: {plugin: 'nav2_route::ReroutingService'}
    AdjustSpeedLimit: {plugin: 'nav2_route::AdjustSpeedLimit'}
    CollisionMonitor: {plugin: 'nav2_route::CollisionMonitor', max_collision_dist: 3.0}
    edge_cost_functions: [DistanceScorer, CostmapScorer]
    DistanceScorer: {plugin: 'nav2_route::DistanceScorer'}
    CostmapScorer: {plugin: 'nav2_route::CostmapScorer'}
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.7, 0.0, 1.2]
    min_velocity: [-0.2, 0.0, -1.2]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # Three polygons, and they never stack: each triggered polygon computes its velocity from the ORIGINAL command and only replaces the current one if |v|^2 (x, y, tw) is smaller, so the most
    # restrictive one wins (collision_monitor_node.cpp processStopSlowdownLimit, types.hpp Velocity::operator<); inside ZoneInner the output is 0.4 x command, not 0.7 x 0.4.
    # ZoneOuter/ZoneInner (Narcis, 2026-10-26): 1.0 m ahead, 0.3 m behind the base centre, +-1.0 m / +-0.5 m. A pedestrian walking at up to 1.2 m/s reaches the 0.29 m robot half-width ~0.4 s after crossing
    # +-0.7 m: 0.6 -> 0.42 -> 0.24 m/s needs ~0.33 s per step (1.0 m/s2 decel + 0.15 s latency, both estimates). Inner +-0.5 m stays just inside a wall 25 cm from the footprint (0.29 + 0.25 = 0.54 m).
    # Sim result (dyn_hall, 0.6 m/s): the pedestrian crossing in front passes at 20 cm instead of 2 cm. They also slow walls and furniture closer than 1.0 / 0.5 m: unmoved obstacles cost time (hospital +18 s,
    # SC7b +32 s per complex trip, F2 +1 s); a lidar-only moving-object filter (ledger NEXT-42) would remove that. Output is a step, not a ramp: the monitor acts after the velocity smoother.
    # 2026-11-03 (Narcis): off while each layer is tested without the others; back on if it proves necessary. The node stays as a pass-through in the cmd_vel chain. The source has to be off too:
    # an enabled source without fresh data orders a stop whatever the polygons say (collision_monitor_node.cpp process).
    polygons: [FootprintApproach, ZoneOuter, ZoneInner]
    FootprintApproach: {type: polygon, action_type: approach, footprint_topic: /local_costmap/published_footprint, time_before_collision: 1.2,
      simulation_time_step: 0.1, min_points: 6, visualize: true, enabled: false}
    ZoneOuter: {type: polygon, points: "[[1.0, 1.0], [1.0, -1.0], [-0.3, -1.0], [-0.3, 1.0]]", action_type: slowdown, slowdown_ratio: 0.7, min_points: 6, visualize: true, enabled: false}
    ZoneInner: {type: polygon, points: "[[1.0, 0.5], [1.0, -0.5], [-0.3, -0.5], [-0.3, 0.5]]", action_type: slowdown, slowdown_ratio: 0.4, min_points: 6, visualize: true, enabled: false}
    observation_sources: [scan]
    scan: {type: scan, topic: scan, min_height: 0.15, max_height: 2.0, enabled: false}
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_footprint
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: [simple_charging_dock]
    simple_charging_dock: {plugin: 'opennav_docking::SimpleChargingDock', docking_threshold: 0.05, staging_x_offset: -0.7, use_external_detection_pose: true,
      use_battery_status: false, use_stall_detection: false, external_detection_timeout: 1.0, external_detection_translation_x: -0.18, external_detection_translation_y: 0.0,
      external_detection_rotation_roll: -1.57, external_detection_rotation_pitch: -1.57, external_detection_rotation_yaw: 0.0, filter_coef: 0.1}
    controller: {k_phi: 3.0, k_delta: 2.0, v_linear_min: 0.15, v_linear_max: 0.15, use_collision_detection: true, costmap_topic: local_costmap/costmap_raw,
      footprint_topic: local_costmap/published_footprint, transform_tolerance: 0.1, projection_time: 5.0, simulation_step: 0.1, dock_collision_threshold: 0.3}
