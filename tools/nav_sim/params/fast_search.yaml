# Overlay (params_merge.py): speeds of the recorded real runs (eco01/eco03: median 0.43-0.45 m/s moving, p95 0.7, turns up to 1.1 rad/s) instead of the sim's 0.3 m/s / 0.6 rad/s.
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.7
      rotate_to_heading_angular_vel: 1.0
      max_robot_pose_search_dist: -1.0   # unbounded: the default (costmap_size_x / 2 = 1.5 m) searches the closest pose only in the first 1.5 m of the plan
velocity_smoother:
  ros__parameters:
    max_velocity: [0.8, 0.0, 1.2]
    min_velocity: [-0.2, 0.0, -1.2]
    max_accel: [1.0, 0.0, 2.5]
    max_decel: [-1.5, 0.0, -2.5]
