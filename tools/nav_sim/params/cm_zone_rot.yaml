# Overlay on cm_zone2: the two slowdown zones apply to translation only. In-place rotation (|v| < 0.05 m/s) gets a polygon inside the robot that never triggers
# (FootprintApproach still guards it), so the zones no longer scale angular speed. Reason: collision_monitor scales the whole twist, and RPP's rotateToHeading clamps w to
# measured w +- max_angular_accel*dt, so a 0.4 ratio makes the rotation settle at accel*dt/(1-0.4) = 0.17 rad/s instead of rotate_to_heading_angular_vel (found 2026-10-30, sim).
collision_monitor:
  ros__parameters:
    ZoneOuter:
      type: velocity_polygon
      holonomic: false
      velocity_polygons: [rotate, forward, backward]
      rotate: {points: "[[0.05, 0.05], [0.05, -0.05], [-0.05, -0.05], [-0.05, 0.05]]", linear_min: -0.05, linear_max: 0.05, theta_min: -3.2, theta_max: 3.2}
      forward: {points: "[[1.0, 1.0], [1.0, -1.0], [-0.3, -1.0], [-0.3, 1.0]]", linear_min: 0.05, linear_max: 1.5, theta_min: -3.2, theta_max: 3.2}
      backward: {points: "[[1.0, 1.0], [1.0, -1.0], [-0.3, -1.0], [-0.3, 1.0]]", linear_min: -1.5, linear_max: -0.05, theta_min: -3.2, theta_max: 3.2}
    ZoneInner:
      type: velocity_polygon
      holonomic: false
      velocity_polygons: [rotate, forward, backward]
      rotate: {points: "[[0.05, 0.05], [0.05, -0.05], [-0.05, -0.05], [-0.05, 0.05]]", linear_min: -0.05, linear_max: 0.05, theta_min: -3.2, theta_max: 3.2}
      forward: {points: "[[1.0, 0.5], [1.0, -0.5], [-0.3, -0.5], [-0.3, 0.5]]", linear_min: 0.05, linear_max: 1.5, theta_min: -3.2, theta_max: 3.2}
      backward: {points: "[[1.0, 0.5], [1.0, -0.5], [-0.3, -0.5], [-0.3, 0.5]]", linear_min: -1.5, linear_max: -0.05, theta_min: -3.2, theta_max: 3.2}
