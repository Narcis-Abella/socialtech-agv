name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libgtest-dev libeigen3-dev python3-pytest python3-numpy python3-scipy python3-yaml python3-pil
      - name: Tests without ROS or a board
        run: scripts/test.sh
