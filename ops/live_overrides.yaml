# Over tools/nav_bench/config/amcl.yaml, and for gn_loc and map_server (nav_live.launch.py), live: AMCL waits for the operator's 2D Pose Estimate in rviz2 (ignored by nodes without that parameter).
/**:
  ros__parameters:
    set_initial_pose: false
    bond_heartbeat_period: 1.0   # map_server / gn_loc side of the bonds (see nav2_params.yaml)
    # 2026-10-30: 0.01 -> 0.005. AMCL-only replays of the 29 Oct occluded turn (AGX): worst yaw 13.4 -> 5.9 deg, tracking unchanged (offset 0.3 m / 10 deg). amcl.yaml notes that alpha <= 0.005 converged late
    # (100-243 s) from LARGE initial offsets: the pose from the relocalizer / rviz2 should be close. Revert: delete these four lines.
    alpha1: 0.005
    alpha2: 0.005
    alpha3: 0.005
    alpha4: 0.005
