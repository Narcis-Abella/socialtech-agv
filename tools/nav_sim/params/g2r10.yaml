# Overlay (params_merge.py): global costmap that reacts faster and sees dynamic obstacles from further away. Packaged: update/publish 1 Hz, obstacles marked up to 5 m and raytraced to 6 m, BT replanning at 1 Hz.
# Here: 2 Hz costmap, marking and raytrace up to 10 m (the 2D sim lidar declares 12 m), BT replanning at 2 Hz (replan2.xml: a faster costmap alone is held back by a 1 Hz replan).
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      obstacle_layer:
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: LaserScan, raytrace_max_range: 10.0, raytrace_min_range: 0.0, obstacle_max_range: 10.0, obstacle_min_range: 0.0}
bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: /tools/nav_sim/bt/replan2.xml
