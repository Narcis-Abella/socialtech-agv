# Overlay (params_merge.py): the legacy Collision Monitor zones (nav2-tracer-agilex config/collision_monitor.yaml), added to the packaged FootprintApproach (1.2 s):
# a frontal slowdown zone (0.8 m ahead, 0.5 m to each side, speed x0.3) and a frontal stop zone (0.4 m ahead, 0.3 m to each side). Legacy approach time was 2.0 s; here the approach polygon is left as packaged.
collision_monitor:
  ros__parameters:
    polygons: [FootprintApproach, SlowdownZone, StopZone]
    SlowdownZone: {type: polygon, points: "[[0.8, 0.5], [0.8, -0.5], [-0.3, -0.5], [-0.3, 0.5]]", action_type: slowdown, slowdown_ratio: 0.3, min_points: 3, visualize: false, enabled: true}
    StopZone: {type: polygon, points: "[[0.4, 0.3], [0.4, -0.3], [-0.2, -0.3], [-0.2, 0.3]]", action_type: stop, min_points: 3, visualize: false, enabled: true}
