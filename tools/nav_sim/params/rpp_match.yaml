# Overlay (params_merge.py): RPP's cost-regulated speed derives the distance to an obstacle from the inflated cell value, which needs the inflation layer's cost_scaling_factor.
# Nav2 README (nav2_regulated_pure_pursuit_controller, jazzy): inflation_cost_scaling_factor "should be exactly the same" as the inflation layer's; default 3.0, ours is 4.0 in both costmaps.
controller_server:
  ros__parameters:
    FollowPath:
      inflation_cost_scaling_factor: 4.0
