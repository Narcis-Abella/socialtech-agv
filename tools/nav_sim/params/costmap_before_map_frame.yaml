# Overlay (NAV2_OVERLAY of nav_full_sim.sh): the costmaps as they were before 2026-11-03 (local in odom at 5 cm, no decay), Collision Monitor still off. The A side of a local costmap A/B.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      resolution: 0.05
global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
behavior_server:
  ros__parameters:
    local_frame: odom
docking_server:
  ros__parameters:
    fixed_frame: odom
